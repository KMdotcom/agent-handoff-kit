[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff-kit"
version = "0.1.0"
description = "Lightweight recovery layer for multi-agent handoffs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-handoff-kit contributors" }]
keywords = [
  "agents",
  "multi-agent",
  "handoff",
  "checkpoint",
  "recovery",
  "openai-agents",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai-agents>=0.2.0"]
demo = ["openai-agents>=0.2.0"]
dev = ["build", "twine", "ruff", "pytest"]

[project.urls]
Homepage = "https://github.com/KMdotcom/handoff-kit"
Repository = "https://github.com/KMdotcom/handoff-kit"
Issues = "https://github.com/KMdotcom/handoff-kit/issues"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agent_handoff_kit*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"demo/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
