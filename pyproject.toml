[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-relay"
version = "0.1.0"
description = "Lightweight recovery layer for multi-agent handoffs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "agent-relay contributors" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai-agents"]

[tool.setuptools.packages.find]
include = ["agent_relay*"]
